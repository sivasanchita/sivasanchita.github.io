---
layout: default
---
<article class="post">
  <header class="page-intro">
    {% if page.category %}<p class="eyebrow">{{ page.category | capitalize }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>

  {{ content }}

  {% if page.substack_url %}
  <p class="card">
    Also published on
    <a href="{{ page.substack_url }}" target="_blank" rel="noopener noreferrer">{{ site.substack.name }}</a>.
  </p>
  {% endif %}
</article>
