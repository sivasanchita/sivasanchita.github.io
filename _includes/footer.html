<footer class="site-footer">
  <div class="container footer-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-name">{{ site.header_name | default: site.title }}</span>
      <span class="brand-tagline">{{ site.tagline }}</span>
    </a>

    <p class="footer-location">{{ site.location }}</p>

    <ul class="footer-links">
      <li><a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">&#8599;</span></a></li>
      <li><a href="{{ site.substack.url }}" target="_blank" rel="noopener noreferrer">Substack ({{ site.substack.name }}) <span aria-hidden="true">&#8599;</span></a></li>
      <li><a href="mailto:{{ site.email }}">Get in touch <span aria-hidden="true">&#8599;</span></a></li>
    </ul>
  </div>
</footer>
